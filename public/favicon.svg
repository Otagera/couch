<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Couch: a sofa on the Sunset-vault teal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8d84"/>
      <stop offset="1" stop-color="#46c2b0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- backrest -->
  <rect x="15" y="17" width="34" height="17" rx="6" fill="#ffffff"/>
  <!-- seat cushion, a touch darker so it reads apart from the back -->
  <rect x="17" y="32" width="30" height="10" rx="3.5" fill="#dff3f0"/>
  <!-- arms -->
  <rect x="8" y="26" width="12" height="19" rx="6" fill="#ffffff"/>
  <rect x="44" y="26" width="12" height="19" rx="6" fill="#ffffff"/>
  <!-- base and legs -->
  <rect x="14" y="41" width="36" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="15" y="45" width="4" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="45" y="45" width="4" height="5" rx="1.5" fill="#ffffff"/>
</svg>
