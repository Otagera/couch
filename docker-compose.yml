# Couch: deployed by Coolify as a Docker Compose resource, next to comics.
#
# CI builds the image and pushes it to GHCR; the host only pulls. `build` is
# kept so `docker compose up --build` still works locally.
#
# As in comics: volume sources, ports, domains and labels are written out in
# full, because Coolify interpolates `environment:` only. Leave the domain
# field in Coolify empty -- routing is declared here -- and keep DNS for the
# domain unproxied (grey cloud) for the HTTP-01 certificate challenge.

services:
  couch:
    image: ${COUCH_IMAGE:-couch:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - SIMKL_CLIENT_ID=${SIMKL_CLIENT_ID}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - STREAMING_COUNTRY_CODE=${STREAMING_COUNTRY_CODE:-NG}
      - STREAMING_SERVICES=${STREAMING_SERVICES}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_PICK_MODEL=${OPENROUTER_PICK_MODEL:-openai/gpt-5.6-luna}
      - OPENROUTER_PROFILE_MODEL=${OPENROUTER_PROFILE_MODEL:-anthropic/claude-haiku-5.5}
      - CHATTERBOX_API_URL=${CHATTERBOX_API_URL:-https://chatterbox.otagera.xyz}
      - CHATTERBOX_APP_NAME=${CHATTERBOX_APP_NAME}
      - CHATTERBOX_API_SECRET=${CHATTERBOX_API_SECRET}
      - COUCH_SYNC_HOURS=${COUCH_SYNC_HOURS:-6}
      # Passkey sign-in. The setup code only registers the first passkey (or
      # one after `cli passkeys reset`); after that sign-in is passkey-only.
      # Required here: without it the site would be open to the internet.
      - COUCH_SETUP_CODE=${COUCH_SETUP_CODE}
      # Passkeys are bound to this origin; it must match the public URL.
      - COUCH_ORIGIN=${COUCH_ORIGIN:-https://couch.otagera.xyz}
      - COUCH_LIST_REFRESH_DAYS=${COUCH_LIST_REFRESH_DAYS:-7}
    volumes:
      # SQLite database and the Letterboxd export (put the CSVs in letterboxd/).
      - /mnt/HC_Volume_106816620/couch:/data
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - proxy
    labels:
      - couch.role=web
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.http-couch.entryPoints=http
      - traefik.http.routers.http-couch.rule=Host(`couch.otagera.xyz`)
      - traefik.http.routers.http-couch.middlewares=redirect-to-https
      - traefik.http.routers.http-couch.service=couch
      - traefik.http.routers.https-couch.entryPoints=https
      - traefik.http.routers.https-couch.rule=Host(`couch.otagera.xyz`)
      - traefik.http.routers.https-couch.middlewares=gzip
      - traefik.http.routers.https-couch.service=couch
      - traefik.http.routers.https-couch.tls=true
      - traefik.http.routers.https-couch.tls.certresolver=letsencrypt
      - traefik.http.services.couch.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-coolify}
